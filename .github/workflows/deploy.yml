name: Deploy Expense Upload

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expense-upload-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          if ! ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "::error::VPS_SSH_PRIVATE_KEY is invalid or requires a passphrase."
            exit 1
          fi
          if ! ssh-keygen -F "$VPS_HOST" -f ~/.ssh/known_hosts >/dev/null; then
            echo "::error::VPS_SSH_KNOWN_HOSTS has no entry matching VPS_HOST."
            exit 1
          fi
      - name: Build and transfer image
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          LIFF_ID: ${{ vars.NEXT_PUBLIC_LIFF_ID || secrets.NEXT_PUBLIC_LIFF_ID }}
        run: |
          set -euo pipefail
          if [ -z "$LIFF_ID" ]; then
            echo "::error::Set NEXT_PUBLIC_LIFF_ID in repository variables or secrets."
            exit 1
          fi
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" true
          docker build --build-arg "INTERNAL_ERP_API_URL=http://erp-api:8084/api/v1" --build-arg "NEXT_PUBLIC_LIFF_ID=$LIFF_ID" -t "erp-expense-upload:$GITHUB_SHA" .
          docker save "erp-expense-upload:$GITHUB_SHA" | ssh -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" docker load
      - name: Deploy and check web
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" bash -s -- "$GITHUB_SHA" <<'SCRIPT'
          set -euo pipefail
          sha="$1"
          docker network inspect erp-network >/dev/null
          if docker inspect erp-expense-upload-previous >/dev/null 2>&1; then
            echo 'Previous web container exists; resolve it before deploying.' >&2
            exit 1
          fi
          had_previous=0
          if docker inspect erp-expense-upload >/dev/null 2>&1; then
            docker stop erp-expense-upload
            docker rename erp-expense-upload erp-expense-upload-previous
            had_previous=1
          fi
          if docker run -d --name erp-expense-upload --network erp-network --restart unless-stopped -p 127.0.0.1:8083:8083 "erp-expense-upload:$sha" >/dev/null; then
            for attempt in $(seq 1 30); do
              if curl -fsS --max-time 5 http://127.0.0.1:8083/ >/dev/null; then
                if [ "$had_previous" = 1 ]; then docker rm erp-expense-upload-previous >/dev/null; fi
                echo 'Expense upload health check passed.'
                exit 0
              fi
              sleep 2
            done
          fi
          echo 'Expense upload deployment failed; restoring previous container if available.' >&2
          docker logs --tail 30 erp-expense-upload 2>/dev/null || true
          docker rm -f erp-expense-upload >/dev/null 2>&1 || true
          if [ "$had_previous" = 1 ]; then docker rename erp-expense-upload-previous erp-expense-upload; docker start erp-expense-upload >/dev/null; fi
          exit 1
          SCRIPT
      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then echo 'Discord webhook is not configured.'; exit 0; fi
          python3 -c 'import json, os; print(json.dumps({"content": "ERP Expense Upload deploy: " + os.environ["JOB_STATUS"] + "\nCommit: " + os.environ["GITHUB_SHA"][:12] + "\n" + os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"], "allowed_mentions": {"parse": []}}))' > "$RUNNER_TEMP/discord.json"
          curl -fsS --retry 3 -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/discord.json" "$DISCORD_WEBHOOK_URL" >/dev/null
